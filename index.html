<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramo Hot Wheels Cósmico 3D</title>
  
  <!-- Fuente Courier Prime -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    /* Regla global de tipografía */
    *, *::before, *::after, html, body, h1, h2, h3, h4, h5, h6, p, span, div, button {
      font-family: 'Courier Prime', 'Courier New', Courier, monospace !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020208;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      perspective: 1200px;
      position: relative;
    }

    /* Fondo de Galaxia y Nebulosa */
    .universe-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 114, 255, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(138, 43, 226, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(5, 5, 25, 0.9) 0%, #020208 100%);
      z-index: 0;
    }

    /* Estrellas parpadeantes */
    .stars {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      box-shadow: 
        100px 200px #fff, 300px 500px #00d2ff, 400px 100px #fff, 
        700px 300px #8be4ff, 900px 600px #fff, 200px 800px #00d2ff,
        1200px 100px #fff, 800px 200px #fff, 500px 700px #8be4ff,
        150px 400px #fff, 650px 850px #00d2ff, 1100px 500px #fff;
      animation: starBlink 3s infinite alternate ease-in-out;
    }

    @keyframes starBlink {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    .hidden {
      display: none !important;
    }

    /* --- Loader Cósmico --- */
    .loader-container {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 85%;
      max-width: 420px;
      background: rgba(8, 15, 35, 0.75);
      padding: 35px 25px;
      border-radius: 24px;
      border: 1px solid rgba(0, 212, 255, 0.4);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0, 114, 255, 0.3), inset 0 0 15px rgba(0, 212, 255, 0.2);
    }

    .loader-title {
      color: #8be4ff;
      font-size: 1.2rem;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(139, 228, 255, 0.8);
    }

    .progress-bar-bg {
      width: 100%;
      height: 18px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      position: relative;
      border: 1px solid rgba(0, 212, 255, 0.5);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0052d4, #4364f7, #00d2ff);
      border-radius: 12px;
      position: relative;
      transition: width 0.05s linear;
      box-shadow: 0 0 20px #00d2ff;
    }

    /* Carrito en la barra de carga usando carrito.PNG */
    .car-icon {
      position: absolute;
      right: -32px;
      top: -26px;
      width: 70px;
      height: auto;
      filter: drop-shadow(0 0 12px #00d2ff) drop-shadow(0 5px 10px rgba(0,0,0,0.9));
      animation: carEngine3D 0.12s infinite alternate ease-in-out;
      display: inline-block;
    }

    .progress-text {
      margin-top: 22px;
      font-weight: bold;
      font-size: 1.4rem;
      color: #00d2ff;
      text-shadow: 0 0 12px #00d2ff;
    }

    /* --- Contenido Principal --- */
    .main-content {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.8s ease-out forwards;
      transform-style: preserve-3d;
    }

    .title {
      color: #ffffff;
      font-size: 1.7rem;
      margin-bottom: 35px;
      letter-spacing: 1px;
      text-shadow: 0 0 12px #00d2ff, 0 0 25px #0052d4, 0 0 40px #8a2be2;
      animation: neonPulse 2s infinite alternate ease-in-out;
      transform: translateZ(40px);
    }

    .bouquet-container {
      position: relative;
      width: 380px;
      height: 420px;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    .glow-bg {
      position: absolute;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.45) 0%, rgba(138, 43, 226, 0.25) 50%, transparent 75%);
      top: 15%;
      left: 50%;
      transform: translateX(-50%) translateZ(-40px);
      animation: pulseGlow 3s infinite alternate ease-in-out;
      border-radius: 50%;
    }

    /* Contenedor e imagen de los carritos */
    .flower {
      position: absolute;
      width: 95px;
      height: 65px;
      cursor: pointer;
      transform-style: preserve-3d;
      animation: floatSpace 4s infinite alternate ease-in-out, carEntry3D 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.27) both;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .flower img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.9)) drop-shadow(0 0 12px #00d2ff);
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    .flower:hover {
      z-index: 40 !important;
    }

    .flower:hover img {
      transform: scale(1.45) translateZ(70px) rotate(-4deg);
      filter: drop-shadow(0 0 25px #8be4ff) drop-shadow(0 0 40px #0072ff) drop-shadow(0 0 50px #8a2be2);
    }

    /* NUEVO ACOMODO MEJORADO Y EQUILIBRADO (ABANICO MULTINIVEL 3D) */
    /* Carrito Superior Centro */
    .f1 { top: 0px; left: 142px; transform: translateZ(50px) rotate(0deg); animation-delay: 0s, 0.1s; z-index: 6; }
    /* Carrito Izquierda Superior */
    .f2 { top: 75px; left: 30px; transform: translateZ(35px) rotate(-15deg); animation-delay: 0.5s, 0.2s; z-index: 5; }
    /* Carrito Derecha Superior */
    .f3 { top: 75px; left: 255px; transform: translateZ(35px) rotate(15deg); animation-delay: 1s, 0.3s; z-index: 5; }
    /* Carrito Centro Protagonista */
    .f4 { top: 155px; left: 142px; transform: translateZ(65px) rotate(0deg); animation-delay: 1.5s, 0.4s; z-index: 7; }
    /* Carrito Izquierda Inferior */
    .f5 { top: 235px; left: 65px; transform: translateZ(20px) rotate(-10deg); animation-delay: 2s, 0.5s; z-index: 4; }
    /* Carrito Derecha Inferior */
    .f6 { top: 235px; left: 220px; transform: translateZ(20px) rotate(10deg); animation-delay: 2.5s, 0.6s; z-index: 4; }

    /* Animaciones 3D Galácticas */
    @keyframes carEngine3D {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(-3px) rotate(2deg); }
    }

    @keyframes carEntry3D {
      0% { opacity: 0; transform: translateZ(400px) translateY(-150px) scale(0.1); }
      100% { opacity: 1; transform: translateZ(0) translateY(0) scale(1); }
    }

    @keyframes floatSpace {
      0% { transform: translateY(0px) translateZ(15px); }
      50% { transform: translateY(-10px) translateZ(30px); }
      100% { transform: translateY(-18px) translateZ(45px); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: translateX(-50%) translateZ(-40px) scale(0.8); }
      100% { opacity: 0.9; transform: translateX(-50%) translateZ(-10px) scale(1.3); }
    }

    @keyframes neonPulse {
      0% { text-shadow: 0 0 10px #00d2ff; }
      100% { text-shadow: 0 0 20px #00d2ff, 0 0 35px #0052d4, 0 0 50px #8a2be2; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* --- Modal y Tarjetas --- */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(2, 2, 8, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(12px);
      animation: fadeIn 0.3s ease-out;
      perspective: 1200px;
      z-index: 100;
    }

    .modal-content {
      position: relative;
      width: 280px;
      height: 400px;
      perspective: 1000px;
    }

    .close-btn {
      position: absolute;
      top: -42px;
      right: -5px;
      color: #00d2ff;
      font-size: 36px;
      cursor: pointer;
      text-shadow: 0 0 12px #00d2ff;
      transition: color 0.2s, transform 0.2s;
    }

    .close-btn:hover {
      color: #fff;
      transform: scale(1.2) rotate(90deg);
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      cursor: pointer;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 212, 255, 0.4);
      border-radius: 18px;
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid rgba(0, 212, 255, 0.6);
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Reverso AZUL Galáctico */
    .card-back {
      background: linear-gradient(145deg, #030d22 0%, #002855 50%, #0055b3 100%);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      box-shadow: inset 0 0 30px rgba(0, 212, 255, 0.5);
      position: relative;
    }

    .card-back::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px dashed rgba(139, 228, 255, 0.4);
      border-radius: 12px;
      pointer-events: none;
    }

    .hw-logo {
      font-weight: 900;
      font-style: italic;
      font-size: 1.6rem;
      color: #ffeb3b;
      margin-bottom: 22px;
      text-shadow: 3px 3px 0px #000, 0 0 15px rgba(255, 235, 59, 0.8);
      letter-spacing: 2px;
    }

    #card-message {
      color: #ffffff;
      font-size: 1.05rem;
      line-height: 1.5;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Fondo de Universo -->
  <div class="universe-bg">
    <div class="stars"></div>
  </div>

  <!-- Pantalla de Carga -->
  <div id="loader-container" class="loader-container">
    <h2 class="loader-title">Hola popooo...</h2>
    <div class="progress-bar-bg">
      <div id="progress-bar" class="progress-bar">
        <img src="carrito.PNG" alt="Carrito" class="car-icon">
      </div>
    </div>
    <p id="progress-text" class="progress-text">0%</p>
  </div>

  <!-- Contenido Principal -->
  <div id="main-content" class="main-content hidden">
    <h1 class="title">TE AMO MI VIDA ME ENCANTAS</h1>
    <div class="bouquet-container" id="bouquet">
      <div class="glow-bg"></div>
      <div class="flower f1" onclick="openCard(0)"><img src="carrito.PNG" alt="Carrito"></div>
      <div class="flower f2" onclick="openCard(1)"><img src="carrito.PNG" alt="Carrito"></div>
      <div class="flower f3" onclick="openCard(2)"><img src="carrito.PNG" alt="Carrito"></div>
      <div class="flower f4" onclick="openCard(3)"><img src="carrito.PNG" alt="Carrito"></div>
      <div class="flower f5" onclick="openCard(4)"><img src="carrito.PNG" alt="Carrito"></div>
      <div class="flower f6" onclick="openCard(5)"><img src="carrito.PNG" alt="Carrito"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="card-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCard()">&times;</span>
      <div class="card-inner" id="card-inner" onclick="flipCard()">
        <div class="card-front">
          <img id="card-img" src="" alt="Hot Wheels">
        </div>
        <div class="card-back">
          <div class="hw-logo">HOT WHEELS</div>
          <p id="card-message"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      let progress = 0;
      const progressBar = document.getElementById("progress-bar");
      const progressText = document.getElementById("progress-text");
      const loaderContainer = document.getElementById("loader-container");
      const mainContent = document.getElementById("main-content");

      const interval = setInterval(() => {
        progress++;
        if (progressBar) progressBar.style.width = progress + "%";
        if (progressText) progressText.innerText = progress + "%";

        if (progress >= 100) {
          clearInterval(interval);
          if (loaderContainer) loaderContainer.classList.add("hidden");
          if (mainContent) mainContent.classList.remove("hidden");
        }
      }, 30);

      // Efecto interactivo Tilt 3D al mover el mouse
      const bouquet = document.getElementById("bouquet");
      document.addEventListener("mousemove", (e) => {
        if (!bouquet) return;
        const xAxis = (window.innerWidth / 2 - e.pageX) / 20;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 20;
        bouquet.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      });
    });

    const cardsData = [
      { img: "hotwheels1.jpeg", msg: "Cuanto más tiempo estoy contigo, más te amo." },
      { img: "hotwheels2.jpeg", msg: "Haces que cada día sea mejor que el anterior." },
      { img: "hotwheels3.jpeg", msg: "Aceleraste mi corazón desde el primer día." },
      { img: "hotwheels4.jpeg", msg: "Eres mi lugar favorito en el mundo." },
      { img: "hotwheels5.jpeg", msg: "Gracias por estar siempre conmigo." },
      { img: "hotwheels6.jpeg", msg: "¡Te amo infinitamente!" }
    ];

    function openCard(index) {
      document.getElementById("card-img").src = cardsData[index].img;
      document.getElementById("card-message").innerText = cardsData[index].msg;
      document.getElementById("card-inner").classList.remove("flipped");
      document.getElementById("card-modal").classList.remove("hidden");
    }

    function closeCard() {
      document.getElementById("card-modal").classList.add("hidden");
    }

    function flipCard() {
      document.getElementById("card-inner").classList.toggle("flipped");
    }
  </script>
</body>
</html>
